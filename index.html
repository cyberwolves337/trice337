<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRI - Controle de Refeições</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f2f2f2; color: #333; position: relative; }
        
        header { 
            background-color: #111111; 
            color: white; 
            padding: 15px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 4px solid #e30613;
        }
        .header-title h1 { font-size: 20px; font-weight: bold; letter-spacing: 1px; }
        .header-title p { font-size: 13px; color: #ccc; margin-top: 3px; }
        
        .container { display: flex; justify-content: center; align-items: center; padding: 30px 15px; min-height: calc(100vh - 100px); }
        .card { 
            background-color: white; 
            padding: 35px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            max-width: 520px; 
            width: 100%;
            transition: filter 0.3s ease;
        }
        
        /* Efeito Embaçado para quando estiver bloqueado */
        .bloqueado-blur {
            filter: blur(5px);
            pointer-events: none;
            user-select: none;
        }

        /* Overlay de Bloqueio */
        .overlay-bloqueio {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-bloqueio {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-top: 5px solid #e30613;
        }

        .modal-bloqueio h2 { font-size: 20px; color: #111; margin-bottom: 10px; }
        .modal-bloqueio p { font-size: 14px; color: #666; line-height: 1.5; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: #444; }
        .form-control { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            font-size: 14px;
            background-color: #fff;
        }
        .form-control:disabled { background-color: #e9ecef; color: #495057; font-weight: bold; cursor: not-allowed; }

        .checkbox-group { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        .checkbox-item { 
            display: flex; 
            align-items: center; 
            padding: 10px 12px; 
            border: 1px solid #e0e0e0; 
            border-radius: 5px; 
            cursor: pointer;
            transition: background 0.2s;
        }
        .checkbox-item:hover { background-color: #f8f9fa; }
        .checkbox-item input { margin-right: 12px; width: 18px; height: 18px; accent-color: #e30613; }

        .btn-enviar { 
            width: 100%; 
            background-color: #e30613; 
            color: white; 
            border: none; 
            padding: 14px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 5px; 
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-enviar:hover { background-color: #b8040f; }
        .btn-enviar:disabled { background-color: #cccccc; cursor: not-allowed; }

        /* Estilo das Mensagens de Status (Substitui o alert nativo) */
        .status-msg { 
            display: none; 
            padding: 15px; 
            border-radius: 5px; 
            margin-top: 15px; 
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            line-height: 1.4;
        }
        .status-sucesso { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-erro { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status-alerta { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

    <!-- Overlay de Alerta de Fechamento -->
    <div id="overlayBloqueio" class="overlay-bloqueio" role="dialog" aria-modal="true">
        <div class="modal-bloqueio">
            <h2>🔒 Agendamento Indisponível</h2>
            <p>O sistema de agendamento de refeições fica disponível exclusivamente de <strong>segunda a terça-feira</strong>.</p>
            <p style="margin-top: 8px;">Volte no início da próxima semana para realizar a sua reserva!</p>
        </div>
    </div>

    <header id="headerApp">
        <div class="header-title">
            <h1>TRI - CONTROLE DE REFEIÇÕES</h1>
            <p>SESI CE337 • Pederneiras</p>
        </div>
    </header>

    <div class="container">
        <div class="card" id="cardForm">
            <form id="formTRI">
                <div class="form-group">
                    <label for="nome">Nome do Funcionário (Digite para buscar):</label>
                    <input type="text" id="nome" list="listaNomes" class="form-control" placeholder="Comece a digitar seu nome..." autocomplete="off" required>
                    <datalist id="listaNomes"></datalist>
                </div>

                <div class="form-group">
                    <label for="email">E-mail Corporativo:</label>
                    <input type="email" id="email" class="form-control" placeholder="Selecione seu nome para carregar o e-mail" disabled required>
                </div>

                <div class="form-group">
                    <label for="semana">Período da Reserva (Semana):</label>
                    <input type="text" id="semana" class="form-control" disabled>
                </div>

                <div class="form-group">
                    <label>Selecione os dias para almoço:</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item"><input type="checkbox" id="chkSeg" value="Segunda-feira"> Segunda-feira</label>
                        <label class="checkbox-item"><input type="checkbox" id="chkTer" value="Terça-feira"> Terça-feira</label>
                        <label class="checkbox-item"><input type="checkbox" id="chkQua" value="Quarta-feira"> Quarta-feira</label>
                        <label class="checkbox-item"><input type="checkbox" id="chkQui" value="Quinta-feira"> Quinta-feira</label>
                        <label class="checkbox-item"><input type="checkbox" id="chkSex" value="Sexta-feira"> Sexta-feira</label>
                    </div>
                </div>

                <button type="submit" class="btn-enviar" id="btnSubmit">CONFIRMAR RESERVA</button>
            </form>

            <div id="statusMsg" class="status-msg"></div>
        </div>
    </div>

    <script>
        // Mapeamento em memória para alta performance
        const funcionarios = [
            { nome: "Ailton Oliveira", email: "ailton.benedito@sesisp.org.br" },
            { nome: "Alessandra Coelho", email: "alessandra.coelho@sesisp.org.br" },
            { nome: "Alessandro Merlin", email: "alessandro.merlin@sesisp.org.br" },
            { nome: "Aline Oliveira", email: "aline.jesus@sesisp.org.br" },
            { nome: "Amanda Tozzi", email: "amanda.cristina@sesisp.org.br" },
            { nome: "Anderson Simoes", email: "anderson.simoes@sesisp.org.br" },
            { nome: "Angelica Urrea", email: "angelica.urrea@sesisp.org.br" },
            { nome: "Anselmo Braz", email: "anselmo.braz@sesisp.org.br" },

            { nome: "Camila Acosta", email: "camila.solana@sesisp.org.br" },

            { nome: "Claudia Damiati", email: "claudia.damiati@sesisp.org.br" },
            { nome: "Daiane Domingos", email: "daiane.pescara@sesisp.org.br" },
            { nome: "Daniela Marinho", email: "daniela.marinho@sesisp.org.br" },
            { nome: "Danilo Souza", email: "danilo.roberto@sesisp.org.br" },
            { nome: "Emerson Barros", email: "emerson.mansano@sesisp.org.br" },
            { nome: "Ester Mercadante", email: "ester.mercadante@sesisp.org.br" },
            { nome: "Fabiana Barbosa", email: "fabiana.abarbosa@sesisp.org.br" },
            { nome: "Fabiana Fornazari", email: "fabiana.fornazari@sesisp.org.br" },
            { nome: "Fabio Miniello", email: "fabio.miniello@sesisp.org.br" },
            { nome: "Fabricio Ribeiro", email: "fabricio.ribeiro@sesisp.org.br" },
            { nome: "Gabriel Oliveira", email: "gabriel.toledo@sesisp.org.br" },
            { nome: "Gabrieli Campos", email: "gabrieli.fernandes@sesisp.org.br" },
            { nome: "Graziela Santos", email: "graziela.santos@sesisp.org.br" },
            { nome: "Isabel Rodrigues", email: "isabel.rodrigues@sesisp.org.br" },
            { nome: "Jacqueline Silva", email: "jacqueline.maciel@sesisp.org.br" },
            { nome: "Joice Pereira", email: "joice.pereira@sesisp.org.br" },
            { nome: "Juliana Silva", email: "juliana.cordeiro@sesisp.org.br" },
            { nome: "Juliana Barbosa", email: "juliana.barbosa@sesisp.org.br" },
            { nome: "Karina Garnica", email: "karina.garnica@sesisp.org.br" },
            { nome: "Katiane Pinto", email: "katiane.galvao@sesisp.org.br" },
            { nome: "Leila Mascaro", email: "leila.mascaro@sesisp.org.br" },
            { nome: "Leticia Rossi", email: "leticia.rossi@sesisp.org.br" },
            { nome: "Leticia Martinez", email: "leticia.martinez@sesisp.org.br" },
            { nome: "Luana Speri", email: "lsperi@sesisp.org.br" },

            { nome: "Marcia Freitas", email: "marcia.maronez@sesisp.org.br" },
            { nome: "Maria Tripoloni", email: "maria.tripoloni@sesisp.org.br" },
            { nome: "Maria Teodoro", email: "maria.teodoro@sesisp.org.br" },
            { nome: "Marina Sartori", email: "marina.zorzin@sesisp.org.br" },
            { nome: "Marlene Almeida", email: "marlene.xavier@sesisp.org.br" },
            { nome: "Mayara Arantes", email: "mayara.arantes@sesisp.org.br" },
            { nome: "Melina Berbel", email: "melina.berbel@sesisp.org.br" },
            { nome: "Rosana Ferreira", email: "rosanaferreira@sesisp.org.br" },
            { nome: "Rosemary Gomes", email: "mary.ferreira@sesisp.org.br" },
            { nome: "Rubia Campos", email: "rubia.campos@sesisp.org.br" },
            { nome: "Susimara Pagan", email: "susimara.guermandi@sesisp.org.br" },
            { nome: "Talita Marestoni", email: "talita.marestoni@sesisp.org.br" },
            { nome: "Tania Baldim", email: "tania.baldim@sesisp.org.br" },
            { nome: "Telma Ferreira", email: "telma.osses@sesisp.org.br" },
            { nome: "Thiago Lima", email: "thiago.llima@sesisp.org.br" },
            { nome: "Thiago Alves", email: "thiago.martini@sesisp.org.br" },
            { nome: "Valeria Motta", email: "valeria.motta@sesisp.org.br" },
            { nome: "Vanessa Barros", email: "vanessa.barros@sesisp.org.br" },
            { nome: "Viviane Barbosa", email: "viviane.barbosa@sesisp.org.br" },
            { nome: "Wayner Valentim", email: "wayner.valentim@sesisp.org.br" },
            { nome: "William Catellan", email: "william.catellan@sesisp.org.br" }
        ];

        // Inicializa o datalist
        const datalist = document.getElementById('listaNomes');
        const fragment = document.createDocumentFragment();
        funcionarios.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f.nome;
            fragment.appendChild(opt);
        });
        datalist.appendChild(fragment);

        // Validação de disponibilidade de dias (Apenas Segunda [1] e Terça [2])
        function verificarDisponibilidade() {
            const hoje = new Date();
            const diaSemana = hoje.getDay(); 
            const estaAberto = true; (diaSemana === 1 || diaSemana === 2);

            if (!estaAberto) {
                document.getElementById('cardForm').classList.add('bloqueado-blur');
                document.getElementById('headerApp').classList.add('bloqueado-blur');
                document.getElementById('overlayBloqueio').style.display = 'flex';
                document.querySelectorAll('#formTRI input, #formTRI button').forEach(el => el.disabled = true);
            }
        }

        verificarDisponibilidade();

        // Autocomplete de e-mail corporativo
        const inputNome = document.getElementById('nome');
        const inputEmail = document.getElementById('email');

        function atualizarEmail() {
            const val = inputNome.value.trim().toLowerCase();
            const pessoa = funcionarios.find(f => f.nome.toLowerCase() === val);
            inputEmail.value = pessoa ? pessoa.email : "";
        }

        inputNome.addEventListener('input', atualizarEmail);
        inputNome.addEventListener('change', atualizarEmail);

        // Cálculo dinâmico da semana seguinte
        function calcularSemana() {
            const hoje = new Date();
            const diaSemana = hoje.getDay();
            const diasAteSegunda = (diaSemana === 0) ? 1 : (8 - diaSemana);
            
            const proximaSegunda = new Date(hoje);
            proximaSegunda.setDate(hoje.getDate() + diasAteSegunda);
            
            const proximaSexta = new Date(proximaSegunda);
            proximaSexta.setDate(proximaSegunda.getDate() + 4);

            const formatar = (d) => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
            document.getElementById('semana').value = `${formatar(proximaSegunda)} a ${formatar(proximaSexta)}`;
        }

        calcularSemana();

        // Exibição de mensagens na interface (Inline)
        function exibirMensagem(texto, tipo) {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.className = `status-msg status-${tipo}`;
            statusMsg.innerText = texto;
            statusMsg.style.display = 'block';
        }

        // Submissão do formulário
        document.getElementById('formTRI').addEventListener('submit', function(e) {
            e.preventDefault();

            const nome = inputNome.value.trim();
            const email = inputEmail.value;
            const semana = document.getElementById('semana').value;
            const btn = document.getElementById('btnSubmit');

            // Validação de E-mail
            if (!email) {
                exibirMensagem("⚠️ Por favor, selecione um nome válido da lista para carregar o e-mail.", "alerta");
                return;
            }

            const seg = document.getElementById('chkSeg').checked ? "Sim" : "Não";
            const ter = document.getElementById('chkTer').checked ? "Sim" : "Não";
            const qua = document.getElementById('chkQua').checked ? "Sim" : "Não";
            const qui = document.getElementById('chkQui').checked ? "Sim" : "Não";
            const sex = document.getElementById('chkSex').checked ? "Sim" : "Não";

            // Validação de Seleção de Dia
            if (seg === "Não" && ter === "Não" && qua === "Não" && qui === "Não" && sex === "Não") {
                exibirMensagem("⚠️️ Por favor, selecione pelo menos um dia para o almoço.", "alerta");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Enviando...";
            document.getElementById('statusMsg').style.display = 'none';

            const webhookURL = "https://default4148a6de0dd14d04a4c578e374e4f6.d6.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/80215e2a62484e3c94f85b483cbab679/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=t6ok-jReLukro890x4QJEJrVd67SaTFlWmM6_r1xVfQ";

            const payload = { nome, email, semana, segunda: seg, terca: ter, quarta: qua, quinta: qui, sexta: sex };

            fetch(webhookURL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Erro na requisição: Status ${response.status}`);
                }
                document.getElementById('formTRI').reset();
                inputEmail.value = "";
                calcularSemana();
                exibirMensagem("✅ Agendamento realizado com sucesso!", "sucesso");
            })
            .catch(error => {
                console.error("Erro no envio:", error);
                exibirMensagem("❌ Ocorreu um erro ao registrar o agendamento. Tente novamente.", "erro");
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "CONFIRMAR RESERVA";
            });
        });
    </script>
</body>
</html>
