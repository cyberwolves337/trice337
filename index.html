<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRI - Controle de Refeições</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f2f2f2; color: #333; }
        
        header { 
            background-color: #111111; 
            color: white; 
            padding: 20px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 4px solid #e30613;
        }
        .header-title h1 { font-size: 20px; font-weight: bold; letter-spacing: 1px; }
        .header-title p { font-size: 13px; color: #ccc; margin-top: 3px; }
        .logo-sesi { 
            background-color: #e30613; 
            color: white; 
            font-weight: 900; 
            font-style: italic; 
            font-size: 22px; 
            padding: 4px 15px; 
            border-radius: 3px;
        }

        .container { display: flex; justify-content: center; align-items: center; padding: 30px 15px; min-height: calc(100vh - 100px); }
        .card { 
            background-color: white; 
            padding: 35px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            max-width: 520px; 
            width: 100%;
        }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: #444; }
        .form-control { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            font-size: 14px;
            background-color: #fff;
        }
        .form-control:disabled { background-color: #e9ecef; color: #495057; font-weight: bold; cursor: not-allowed; }

        .checkbox-group { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        .checkbox-item { 
            display: flex; 
            align-items: center; 
            padding: 10px 12px; 
            border: 1px solid #e0e0e0; 
            border-radius: 5px; 
            cursor: pointer;
            transition: background 0.2s;
        }
        .checkbox-item:hover { background-color: #f8f9fa; }
        .checkbox-item input { margin-right: 12px; width: 18px; height: 18px; accent-color: #e30613; }

        .btn-enviar { 
            width: 100%; 
            background-color: #e30613; 
            color: white; 
            border: none; 
            padding: 14px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 5px; 
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-enviar:hover { background-color: #b8040f; }

        .mensagem-sucesso { 
            display: none; 
            padding: 15px; 
            background-color: #d4edda; 
            color: #155724; 
            border: 1px solid #c3e6cb; 
            border-radius: 5px; 
            margin-top: 15px; 
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>TRI - CONTROLE DE REFEIÇÕES</h1>
            <p>SESI CE337 • Pederneiras</p>
        </div>
        <div class="logo-sesi">SESI</div>
    </header>

    <div class="container">
        <div class="card">
            <form id="formTRI">
                
                <div class="form-group">
                    <label>Nome do Funcionário:</label>
                    <input type="text" id="nome" class="form-control" placeholder="Digite seu nome completo" required>
                </div>

                <div class="form-group">
                    <label>E-mail Corporativo:</label>
                    <input type="email" id="email" class="form-control" placeholder="seu.email@sesisp.org.br" required>
                </div>

                <div class="form-group">
                    <label>Período da Reserva (Semana):</label>
                    <input type="text" id="semana" class="form-control" disabled>
                </div>

                <div class="form-group">
                    <label>Selecione os dias para almoço:</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item"><input type="checkbox" name="dias" value="Segunda-feira"> Segunda-feira</label>
                        <label class="checkbox-item"><input type="checkbox" name="dias" value="Terça-feira"> Terça-feira</label>
                        <label class="checkbox-item"><input type="checkbox" name="dias" value="Quarta-feira"> Quarta-feira</label>
                        <label class="checkbox-item"><input type="checkbox" name="dias" value="Quinta-feira"> Quinta-feira</label>
                        <label class="checkbox-item"><input type="checkbox" name="dias" value="Sexta-feira"> Sexta-feira</label>
                    </div>
                </div>

                <button type="submit" class="btn-enviar" id="btnSubmit">CONFIRMAR RESERVA</button>
            </form>

            <div id="msgSucesso" class="mensagem-sucesso">
                ✅ Agendamento realizado com sucesso!
            </div>
        </div>
    </div>

    <script>
        let dataSegundaFormatada = "";

        // Função que calcula a próxima semana
        function calcularSemana() {
            let hoje = new Date();
            let diaSemana = hoje.getDay();
            let diasAteSegunda = (diaSemana === 0) ? 1 : (8 - diaSemana);
            
            let proximaSegunda = new Date(hoje);
            proximaSegunda.setDate(hoje.getDate() + diasAteSegunda);
            
            let proximaSexta = new Date(proximaSegunda);
            proximaSexta.setDate(proximaSegunda.getDate() + 4);

            function formatar(d) {
                let dia = String(d.getDate()).padStart(2, '0');
                let mes = String(d.getMonth() + 1).padStart(2, '0');
                return `${dia}/${mes}/${d.getFullYear()}`;
            }

            dataSegundaFormatada = formatar(proximaSegunda);
            document.getElementById('semana').value = `${formatar(proximaSegunda)} a ${formatar(proximaSexta)}`;
        }

        calcularSemana();

        // Envio do Formulário para o Power Automate
        document.getElementById('formTRI').addEventListener('submit', function(e) {
            e.preventDefault();

            let nome = document.getElementById('nome').value;
            let email = document.getElementById('email').value;
            let semana = document.getElementById('semana').value;
            let btn = document.getElementById('btnSubmit');

            let diasSelecionados = [];
            document.querySelectorAll('input[name="dias"]:checked').forEach(c => diasSelecionados.push(c.value));

            if (diasSelecionados.length === 0) {
                alert("Por favor, selecione pelo menos um dia para o almoço.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Enviando...";

            // Sua URL exata do Power Automate
            let webhookURL = "https://default4148a6de0dd14d04a4c578e374e4f6.d6.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/80215e2a62484e3c94f85b483cbab679/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=t6ok-jReLukro890x4QJEJrVd67SaTFlWmM6_r1xVfQ";

            let dados = {
                nome: nome,
                email: email,
                semana: semana,
                segundaData: dataSegundaFormatada,
                dias: diasSelecionados.join(", ")
            };

            fetch(webhookURL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(dados)
            })
            .then(() => {
                document.getElementById('formTRI').reset();
                calcularSemana();
                document.getElementById('msgSucesso').style.display = 'block';
                btn.disabled = false;
                btn.innerText = "CONFIRMAR RESERVA";
            })
            .catch((err) => {
                console.error(err);
                document.getElementById('formTRI').reset();
                calcularSemana();
                document.getElementById('msgSucesso').style.display = 'block';
                btn.disabled = false;
                btn.innerText = "CONFIRMAR RESERVA";
            });
        });
    </script>
</body>
</html>
